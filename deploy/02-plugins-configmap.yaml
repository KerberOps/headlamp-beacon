# beacon-plugins-apps ConfigMap
#
# Defines which Headlamp plugins and the Headlamp itself to monitor.
# Each entry compares the running container image tag against the latest
# published version on GitHub or GHCR.
#
# Fields:
#   currentVersion.namespace    - Kubernetes namespace of the deployment
#   currentVersion.deployment   - Deployment name
#   currentVersion.container    - Container name (optional, defaults to first)
#   currentVersion.initContainer - Init container name (for sidecar-installed plugins)
#   latestVersion.type          - github-release | github-tag | ghcr-tag | manual
#   latestVersion.repo          - GitHub repo in "owner/repo" format
#   latestVersion.tagPrefix     - Prefix to filter tags (e.g. "v")
#   latestVersion.stripPrefix   - Remove the prefix from the displayed version
#   latestVersion.releaseUrl    - URL opened when clicking the status badge
#
# After editing: kubectl apply -f deploy/02-plugins-configmap.yaml
# Then trigger the updater: kubectl create job --from=cronjob/beacon-updater beacon-updater-now -n ops-headlamp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-plugins-apps
  namespace: ops-headlamp
  labels:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: headlamp
data:
  apps.json: |
    [
      {
        "name": "Headlamp",
        "currentVersion": {
          "namespace": "ops-headlamp",
          "deployment": "headlamp",
          "container": "headlamp"
        },
        "latestVersion": {
          "type": "github-tag",
          "repo": "kubernetes-sigs/headlamp",
          "tagPrefix": "v",
          "stripPrefix": false,
          "releaseUrl": "https://github.com/kubernetes-sigs/headlamp/releases"
        }
      },
      {
        "name": "Beacon Plugin",
        "currentVersion": {
          "namespace": "ops-headlamp",
          "deployment": "headlamp",
          "initContainer": "beacon-plugin"
        },
        "latestVersion": {
          "type": "github-tag",
          "repo": "KerberOps/headlamp-beacon",
          "tagPrefix": "v",
          "stripPrefix": false,
          "releaseUrl": "https://github.com/KerberOps/headlamp-beacon/releases"
        }
      }
    ]
