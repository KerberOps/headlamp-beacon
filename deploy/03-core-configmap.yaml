# beacon-core-apps ConfigMap
#
# Defines which infrastructure deployments to monitor.
# Adapt the entries below to match your cluster's actual deployments.
#
# vPrefix: true  → forces a "v" prefix on the current version when the
#                  container image does not include it (e.g. bitnami images)
#
# After editing: kubectl apply -f deploy/03-core-configmap.yaml
# Then trigger the updater: kubectl create job --from=cronjob/beacon-updater beacon-updater-now -n ops-headlamp
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: beacon-core-apps
  namespace: ops-headlamp
  labels:
    app.kubernetes.io/name: beacon
    app.kubernetes.io/component: config
    app.kubernetes.io/part-of: headlamp
data:
  apps.json: |
    [
      {
        "name": "cert-manager",
        "currentVersion": {
          "namespace": "cert-manager",
          "deployment": "cert-manager",
          "container": "cert-manager-controller"
        },
        "latestVersion": {
          "type": "github-release",
          "repo": "cert-manager/cert-manager",
          "releaseUrl": "https://github.com/cert-manager/cert-manager/releases"
        }
      },
      {
        "name": "Ingress NGINX",
        "currentVersion": {
          "namespace": "ingress-nginx",
          "deployment": "ingress-nginx-controller",
          "container": "controller"
        },
        "latestVersion": {
          "type": "github-release",
          "repo": "kubernetes/ingress-nginx",
          "releaseUrl": "https://github.com/kubernetes/ingress-nginx/releases"
        }
      },
      {
        "name": "Sealed Secrets",
        "currentVersion": {
          "namespace": "sealed-secrets",
          "deployment": "sealed-secrets-controller",
          "container": "controller",
          "vPrefix": true
        },
        "latestVersion": {
          "type": "github-tag",
          "repo": "bitnami-labs/sealed-secrets",
          "tagPrefix": "v",
          "stripPrefix": false,
          "releaseUrl": "https://github.com/bitnami-labs/sealed-secrets/releases"
        }
      }
    ]
